<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simmetry | Floor Plan Builder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-bar">
    <div>
        <h1>Simmetry</h1>
        <p>Simple plans, smarter choices.</p>
    </div>

    <nav>
        <button id="newPlanBtn">New Plan</button>
        <button>Save</button>
        <button>Export</button>
    </nav>
</header>

<main class="workspace">

    <aside class="tool-panel">
        <h2>Rooms</h2>

        <button class="tool">Living Room</button>
        <button class="tool">Kitchen</button>
        <button class="tool">Bedroom</button>
        <button class="tool">Bathroom</button>

        <h2>Elements</h2>

        <button class="tool">Door</button>
        <button class="tool">Window</button>
    </aside>

    <section class="canvas-area">
        <div class="canvas-header">
            <h2>Floor Plan</h2>
            <span>Grid: 1 ft</span>
        </div>

        <div id="floorPlan" class="floor-plan">
            <div class="sample-room">
                <span>Living Room</span>
                <small>12' × 14'</small>
            </div>
        </div>
    </section>

    <aside class="properties-panel">
        <h2>Properties</h2>

        <label for="roomName">Room Name</label>
        <input
            type="text"
            id="roomName"
            value="Living Room"
        >

        <label for="width">Width</label>
        <input
            type="number"
            id="width"
            value="12"
        >

        <label for="height">Height</label>
        <input
            type="number"
            id="height"
            value="14"
        >

        <button class="primary-button">Update Room</button>
    </aside>

</main>

<footer>
    <span>Simmetry Floor Plan Builder</span>

    <div>
        <button>−</button>
        <span>100%</span>
        <button>+</button>
    </div>
</footer>

<script src="script.js"></script>

</body>
</html>
